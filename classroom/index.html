<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A simple classroom writing board. No accounts or setup.">
<title>Classroom Board</title>
<link rel="stylesheet" href="board.css">
<script src="board.js" defer></script>
</head>
<body>
<header class="toolbar" aria-label="Board controls">
<a class="home" href="../" aria-label="Home" title="Home">⌂</a>
<div class="tools" role="group" aria-label="Text formatting">
<button id="bold" type="button" title="Bold (Ctrl or Command B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
<button id="underline" type="button" title="Underline (Ctrl or Command U)" aria-label="Underline" aria-pressed="false"><u>U</u></button>
<label class="colour" title="Text colour"><span class="sr-only">Text colour</span><input id="colour" type="color" value="#202124" aria-label="Text colour"></label>
<label class="size-label"><span class="sr-only">Font size</span><select id="size" aria-label="Font size"><option value="24">24 px</option><option value="32">32 px</option><option value="40" selected>40 px</option><option value="48">48 px</option><option value="56">56 px</option><option value="64">64 px</option><option value="72">72 px</option><option value="96">96 px</option></select></label>
</div>
<span id="status" role="status" aria-live="polite">Ready</span>
<div class="actions"><button id="restore" type="button" disabled title="Return to the board saved before the last clear">Restore board</button><button id="clear" type="button">Clear</button><button id="fullscreen" type="button" aria-pressed="false">Fullscreen</button></div>
</header>
<main id="board" aria-label="Classroom board">
<div id="date" class="editable date" contenteditable="true" role="textbox" aria-label="Date" spellcheck="false"></div>
<div id="subject" class="editable subject" contenteditable="true" role="textbox" aria-label="Lesson title or subject" data-placeholder="Lesson title" spellcheck="true"></div>
<div id="writing" class="editable writing" contenteditable="true" role="textbox" aria-label="Main writing area" aria-multiline="true" data-placeholder="Write here…" spellcheck="true"></div>
</main>
<dialog id="clear-dialog" aria-labelledby="clear-title"><form method="dialog"><h2 id="clear-title">Clear the board?</h2><p>The current board will be saved so you can restore it.</p><div class="dialog-actions"><button value="cancel" autofocus>Cancel</button><button value="clear" class="confirm">Clear board</button></div></form></dialog>
<dialog id="restore-dialog" aria-labelledby="restore-title"><form method="dialog"><h2 id="restore-title">Restore the previous board?</h2><p>This will replace what is on the board now. You can use Restore board again to return to it.</p><div class="dialog-actions"><button value="cancel" autofocus>Cancel</button><button value="restore" class="confirm">Restore board</button></div></form></dialog>
</body>
</html>
